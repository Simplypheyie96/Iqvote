
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IQ VOTE</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />

    <!-- Paint the saved theme before first render so there is never a flash
         of the wrong one. Must stay inline and before the stylesheet. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('iqvote-theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Open+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- OG / Social sharing -->
    <meta property="og:title" content="IQ Vote - Employee of the Month Voting" />
    <meta property="og:description" content="Modern employee recognition platform with frictionless voting experience" />
    <meta property="og:image" content="https://iqvote.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://iqvote.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://iqvote.vercel.app" />
    <meta property="og:site_name" content="IQ Vote" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IQ Vote - Employee of the Month Voting" />
    <meta name="twitter:description" content="Modern employee recognition platform with frictionless voting experience" />
    <meta name="twitter:image" content="https://iqvote.vercel.app/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
